[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: runs the pure-Python legacy cipher (a few seconds)"]

[tool.ruff]
line-length = 110
target-version = "py312"
# The legacy device is intentionally left untouched by the modernisation.
extend-exclude = ["device"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["common", "cloud", "gateway"]
omit = ["gateway/legacy_decrypt.py", "common/keygen.py"]
