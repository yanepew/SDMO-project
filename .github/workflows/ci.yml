name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # lets the CD workflow reuse this pipeline

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # the project is run on Windows
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: Static security analysis (legacy device excluded on purpose)
        run: bandit -r common cloud gateway -x gateway/legacy_decrypt.py -ll
      - name: Known-vulnerability scan of dependencies
        run: pip-audit -r requirements.txt

  smoke:
    # Starts the real services and pushes one aggregate through the ML-KEM channel.
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m common.keygen dev
      - name: End-to-end check
        run: |
          python -m cloud.cloud_service > cloud.log 2>&1 &
          sleep 3
          python -m gateway.gateway_service --interval 2s > gateway.log 2>&1 &
          sleep 3
          python scripts/smoke_test.py
